{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · professional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'seller/css/login.css' %}">
</head>
<body>

<div class="card">
    <h1>Forgot Password</h1>

    {% if e_msg %}
    <div class="alert alert-danger" role="alert">
        {{ e_msg }}
    </div>
    {% endif %}

    <form method="post" action="{% url 'forgot_password' %}">
        {% csrf_token %}

        <div class="field-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        

        <input type="submit" class="action-btn" value="Send otp →">
    </form>

    <div class="footer-sign">
        Don’t have an account? <a href="{% url 'login' %}">Login</a>
        <span style="display: block; font-size:0.90rem; margin-top: 5px; color:#a0aec0">
            <a href="{% url 'forgot_password' %}">Forgot password?</a>
        </span>
    </div>
</div>

</body>
</html>
