{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · professional</title>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="{% static 'seller/css/register.css' %}">
</head>
<body>
    <form action="{% url 'register' %}" method="post">
        {% csrf_token %}
    <div class="card">
        <h1>Register</h1>

        <!-- Select Role dropdown (seller / customer) -->
        <div class="field-group">
            <label>Select Role</label>  
            <select id="roleSelect" name="role" required>
                <option value="" disabled selected>— Choose role —</option>
                <option value="seller">Seller</option>
                <option value="customer">Customer</option>
            </select>
        </div>

        <!-- First name & Last name -->
        <div class="double-field">
            <div class="field-group">
                <label>First name</label>
                <input type="text" placeholder="Enter your first name" name="firstname" required>
            </div>
            <div class="field-group">
                <label>Last name</label>
                <input type="text" placeholder="Enter your last name" name="lastname" required>
            </div>
        </div>

        <!-- Phone -->
        <div class="field-group">
            <label>Phone</label>
            <input type="tel" placeholder="Enter your contact no" name="contactno" required>
        </div>

        <!-- Email -->
        <div class="field-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" name="email" required>
        </div>

        <!-- Create Account button -->
        <button class="action-btn">Create Account →</button>

        <!-- Sign in link -->
        <div class="footer-sign">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </div>
    </div>
    </form>
</body>
</html>
